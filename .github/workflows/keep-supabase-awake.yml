# Pings the live catalog once a day so a Free-plan Supabase project
# does not pause after a week of no visitors.
# Required GitHub secrets: SUPABASE_URL, SUPABASE_ANON_KEY

name: Keep Supabase awake

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query categories table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY in GitHub repo secrets."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            > /dev/null
          echo "Supabase ping ok"
